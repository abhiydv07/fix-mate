<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fix Mate — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0b0f17;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.5rem; }
    p { font-size: 0.75rem; color: #94a3b8; max-width: 280px; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #0c8de9;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
    }
    button:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="icon">🔧</div>
  <h1>You&apos;re Offline</h1>
  <p>Fix Mate needs an internet connection to book services. Please check your connection and try again.</p>
  <button onclick="window.location.reload()">Retry</button>
</body>
</html>
